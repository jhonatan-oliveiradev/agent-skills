name: Materialize case 002 test updates

on:
  push:
    branches:
      - feat/real-use-case-002-ping-space-voice

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/real-use-case-002-ping-space-voice
          fetch-depth: 0

      - name: Apply derived evidence expectations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old!r}")
              file.write_text(text.replace(old, new, 1))

          archive = "apps/web/src/components/evidence/evidence-archive.test.tsx"
          replace(
              archive,
              '"/en/built-with-skills/portfolio-translation-hardening",',
              '"/en/built-with-skills/ping-space-voice-membership-authorization",',
          )
          replace(
              archive,
              '"/pt-BR/built-with-skills/portfolio-translation-hardening",',
              '"/pt-BR/built-with-skills/ping-space-voice-membership-authorization",',
          )
          replace(
              archive,
              'expect(container.querySelectorAll("[data-evidence-feature]")).toHaveLength(3);',
              'expect(container.querySelectorAll("[data-evidence-feature]")).toHaveLength(4);',
          )
          replace(
              archive,
              'expect(screen.getAllByText(state)).toHaveLength(3);',
              'expect(screen.getAllByText(state)).toHaveLength(4);',
          )
          replace(
              archive,
              'expect(screen.getByText(realUseProvenance)).toBeInTheDocument();',
              'expect(screen.getAllByText(realUseProvenance)).toHaveLength(2);',
          )

          shell = "apps/web/src/components/site-shell.test.tsx"
          replace(
              shell,
              '["en", "Don\'t trust the description. Inspect the result.", "Hardening a translation provider after a production incident", "Catalog experience", "Pack experience"],',
              '["en", "Don\'t trust the description. Inspect the result.", "Hardening Space voice credential authorization", "Hardening a translation provider after a production incident", "Catalog experience", "Pack experience"],',
          )
          replace(
              shell,
              '["pt-BR", "Não confie na descrição. Inspecione o resultado.", "Hardening de um provider de tradução após um incidente em produção", "Experiência do catálogo", "Experiência dos pacotes"],',
              '["pt-BR", "Não confie na descrição. Inspecione o resultado.", "Hardening da autorização de credenciais de voz em Spaces", "Hardening de um provider de tradução após um incidente em produção", "Experiência do catálogo", "Experiência dos pacotes"],',
          )
          replace(
              shell,
              '] as const)("renders the evidence archive for %s", async (locale, heading, portfolio, catalog, packs) => {',
              '] as const)("renders the evidence archive for %s", async (locale, heading, ping, portfolio, catalog, packs) => {',
          )
          replace(
              shell,
              'expect(screen.getByRole("heading", { name: portfolio })).toBeInTheDocument();',
              'expect(screen.getByRole("heading", { name: ping })).toBeInTheDocument();\n    expect(screen.getByRole("heading", { name: portfolio })).toBeInTheDocument();',
          )
          replace(
              shell,
              'expect(container.querySelectorAll("[data-evidence-feature]")).toHaveLength(3);',
              'expect(container.querySelectorAll("[data-evidence-feature]")).toHaveLength(4);',
          )

          relations = "apps/web/src/lib/cross-domain-relations.test.ts"
          replace(
              relations,
              'expect(relations).toHaveLength(3);',
              'expect(relations).toHaveLength(4);',
          )
          replace(
              relations,
              '    const portfolioRelation = relations.find(\n',
              '    const pingRelation = relations.find(\n      (relation) => relation.case.slug === "ping-space-voice-membership-authorization",\n    );\n    expect(pingRelation).toMatchObject({\n      case: { slug: "ping-space-voice-membership-authorization" },\n      matchingSkillSlugs: ["shipping-github-vercel-changes"],\n      coversEntirePack: false,\n    });\n\n    const portfolioRelation = relations.find(\n',
          )

          blueprint = "apps/web/src/components/packs/pack-blueprint.test.tsx"
          replace(
              blueprint,
              'expect(container.querySelectorAll("[data-pack-evidence-relation]")).toHaveLength(3);',
              'expect(container.querySelectorAll("[data-pack-evidence-relation]")).toHaveLength(4);',
          )
          replace(
              blueprint,
              '    expect(\n      screen.getByRole("link", {\n        name: "Hardening a translation provider after a production incident",\n      }),\n    ).toHaveAttribute("href", "/en/built-with-skills/portfolio-translation-hardening");',
              '    expect(\n      screen.getByRole("link", {\n        name: "Hardening Space voice credential authorization",\n      }),\n    ).toHaveAttribute(\n      "href",\n      "/en/built-with-skills/ping-space-voice-membership-authorization",\n    );\n    expect(\n      screen.getByRole("link", {\n        name: "Hardening a translation provider after a production incident",\n      }),\n    ).toHaveAttribute("href", "/en/built-with-skills/portfolio-translation-hardening");',
          )
          replace(
              blueprint,
              'expect(screen.getByText("1 / 8 methods represented")).toBeInTheDocument();',
              'expect(screen.getAllByText("1 / 8 methods represented")).toHaveLength(2);',
          )
          PY

      - name: Commit materialized expectations
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/evidence/evidence-archive.test.tsx \
            apps/web/src/components/site-shell.test.tsx \
            apps/web/src/lib/cross-domain-relations.test.ts \
            apps/web/src/components/packs/pack-blueprint.test.tsx
          git diff --cached --exit-code && exit 1 || true
          git commit -m "test: align evidence archive expectations"
          git push origin HEAD:feat/real-use-case-002-ping-space-voice
