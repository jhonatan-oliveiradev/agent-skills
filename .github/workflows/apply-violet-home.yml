name: Apply approved violet token patch

on:
  push:
    branches: [refactor/home-evidence-first-purple]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[violet-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/home-evidence-first-purple
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Replace semantic blue tokens with Dark Veil violet
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/web/src/app/globals.css';
          let css = fs.readFileSync(path, 'utf8');
          const replacements = new Map([
            ['--editorial-accent: #1745e8;', '--editorial-accent: #6d28d9;'],
            ['--editorial-focus: #1745e8;', '--editorial-focus: #7c3aed;'],
            ['--editorial-accent: #6f91ff;', '--editorial-accent: #a78bfa;'],
            ['--editorial-focus: #8ea8ff;', '--editorial-focus: #c4b5fd;'],
          ]);
          for (const [from, to] of replacements) {
            if (!css.includes(from) && !css.includes(to)) {
              throw new Error(`Expected token not found: ${from}`);
            }
            css = css.replace(from, to);
          }
          fs.writeFileSync(path, css);
          NODE
      - name: Commit token patch
        shell: bash
        run: |
          if git diff --quiet -- apps/web/src/app/globals.css; then
            echo "Token patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/globals.css
          git commit -m "refactor(web): align product accent with Dark Veil [violet-patch]"
          git push origin HEAD:refactor/home-evidence-first-purple
