name: Motion evidence edit

on:
  push:
    branches:
      - feat/motion-real-use

permissions:
  contents: write

jobs:
  edit:
    if: github.event.head_commit.message != 'chore: apply Motion evidence registry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/motion-real-use
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply anchored evidence edits
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/web/src/lib/built-with-skills.ts';
          let src = fs.readFileSync(path, 'utf8');
          const replaceOnce = (from, to) => {
            if (!src.includes(from)) throw new Error(`missing anchor: ${from.slice(0, 80)}`);
            src = src.replace(from, to);
          };

          replaceOnce(
            'const strataArchitectureCaseSourcePath =\n  "docs/built-with-skills/2026-09-03-strata-contracts-architecture-boundaries.md";\n',
            'const strataArchitectureCaseSourcePath =\n  "docs/built-with-skills/2026-09-03-strata-contracts-architecture-boundaries.md";\nconst tsukiharaMotionCaseSourcePath =\n  "docs/built-with-skills/2026-09-03-tsukihara-cinematic-motion-hardening.md";\n',
          );

          replaceOnce(
            'const strataProject = {\n  id: "strata",\n  name: "STRATA",\n} as const satisfies CaseProject;\n',
            'const strataProject = {\n  id: "strata",\n  name: "STRATA",\n} as const satisfies CaseProject;\n\nconst tsukiharaProject = {\n  id: "tsukihara",\n  name: "Tsukihara",\n} as const satisfies CaseProject;\n',
          );

          const motionCase = `  {
            slug: "tsukihara-cinematic-motion-hardening",
            date: "2026-09-03",
            sourcePath: tsukiharaMotionCaseSourcePath,
            evidenceClass: "real-use",
            project: tsukiharaProject,
            skills: [
              "craft-premium-motion",
              "engineering-gsap-animations",
              "orchestrating-cinematic-web-motion",
              "optimizing-frontend-motion-performance",
              "reconstructing-images-as-threejs",
            ],
            evidence: [
              {
                type: "source",
                href: \`${'${repositoryUrl}'}/blob/main/${'${tsukiharaMotionCaseSourcePath}'}\`,
                labels: { en: "Public case record", "pt-BR": "Registro público do case" },
              },
              {
                type: "qa",
                href: \`${'${repositoryUrl}'}/blob/main/${'${tsukiharaMotionCaseSourcePath}'}#verification-record\`,
                labels: { en: "Verification record", "pt-BR": "Registro de verificação" },
              },
            ],
            locales: {
              en: {
                title: "Hardening a cinematic WebGL experience for motion, accessibility, and reference fidelity",
                summary: "A real Tsukihara maintenance slice used the complete Motion pack to tighten GSAP lifecycle ownership, reduce WebGL work under reduced motion, preserve cinematic continuity, and reconstruct the eclipse moon from reference-supported Three.js geometry.",
                challenge: "Improve an existing GSAP, Lenis, and React Three Fiber experience without redesigning it: honor reduced-motion intent in the persistent world, remove unnecessary ScrollTrigger work, keep one cinematic ownership model, and make the procedural eclipse moon evidence-limited rather than speculative.",
                decisions: [
                  { title: "Make reduced motion a runtime contract", summary: "Observe prefers-reduced-motion in the persistent R3F world, switch that mode to demand rendering and lower DPR, and remove continuous petals and pointer embers instead of merely disabling the hero timeline." },
                  { title: "Keep GSAP lifecycle aligned with actual ownership", summary: "Do not schedule ScrollTrigger.refresh() when the reduced-motion hero path has no active timeline to refresh." },
                  { title: "Preserve one cinematic system", summary: "Keep hero, eclipse state, camera movement, and persistent WebGL world coordinated rather than adding another independent decorative animation layer." },
                  { title: "Reconstruct only what the reference proves", summary: "Model the visible eclipse as a deterministic frontal disc/shadow plus crimson RingGeometry rim, explicitly avoiding unseen backside, crater topology, or 360-degree fidelity claims." },
                ],
                results: [
                  "Reduced-motion sessions now use an on-demand WebGL loop with lower DPR and no continuous petals or pointer embers.",
                  "The reduced-motion hero path no longer schedules an unnecessary ScrollTrigger refresh.",
                  "The eclipse moon has a deterministic, reference-grounded procedural rim/halo without speculative hidden geometry.",
                  "The final Tsukihara candidate passed 8/8 Motion/hero tests, 97/97 REMEMBER tests, formatting, lint, production build, and Chromium hero runtime smoke.",
                  "The merged Tsukihara main commit passed the canonical Quality workflow before this case was recorded.",
                ],
              },
              "pt-BR": {
                title: "Hardening de uma experiência WebGL cinematográfica para motion, acessibilidade e fidelidade à referência",
                summary: "Um slice real de manutenção no Tsukihara usou o pack completo de Motion para reforçar o lifecycle do GSAP, reduzir trabalho WebGL em reduced motion, preservar continuidade cinematográfica e reconstruir a lua do eclipse com geometria Three.js sustentada pela referência.",
                challenge: "Melhorar uma experiência existente com GSAP, Lenis e React Three Fiber sem redesenhá-la: respeitar reduced motion no world persistente, remover trabalho desnecessário de ScrollTrigger, manter um único modelo de ownership cinematográfico e limitar a lua procedural ao que a referência realmente comprova.",
                decisions: [
                  { title: "Transformar reduced motion em contrato de runtime", summary: "Observar prefers-reduced-motion no world R3F persistente, usar renderização sob demanda e DPR menor nesse modo e remover pétalas contínuas e pointer embers em vez de apenas desligar a timeline da hero." },
                  { title: "Alinhar o lifecycle do GSAP ao ownership real", summary: "Não agendar ScrollTrigger.refresh() quando o caminho reduced-motion da hero não possui timeline ativa para atualizar." },
                  { title: "Preservar um único sistema cinematográfico", summary: "Manter hero, estado de eclipse, movimento de câmera e world WebGL persistente coordenados, sem adicionar uma camada decorativa independente." },
                  { title: "Reconstruir somente o que a referência comprova", summary: "Modelar o eclipse visível como disco/sombra frontal determinístico com rim carmesim em RingGeometry, evitando alegações sobre backside, topologia de crateras ou fidelidade 360 graus não observáveis." },
                ],
                results: [
                  "Sessões com reduced motion agora usam loop WebGL sob demanda, DPR menor e removem pétalas contínuas e pointer embers.",
                  "O caminho reduced-motion da hero deixou de agendar um ScrollTrigger refresh desnecessário.",
                  "A lua do eclipse ganhou rim/halo procedural determinístico e sustentado pela referência, sem geometria oculta especulativa.",
                  "O candidato final do Tsukihara passou 8/8 testes Motion/hero, 97/97 testes REMEMBER, formatação, lint, build de produção e runtime smoke da hero em Chromium.",
                  "O commit mergeado na main do Tsukihara passou o workflow canônico Quality antes de este case ser registrado.",
                ],
              },
            },
          },
`;
          replaceOnce('  {\n    slug: "catalog-experience",', motionCase + '  {\n    slug: "catalog-experience",');
          fs.writeFileSync(path, src);

          const archivePath = 'apps/web/src/components/evidence/evidence-archive.test.tsx';
          let archive = fs.readFileSync(archivePath, 'utf8');
          archive = archive.replace('toHaveLength(8);', 'toHaveLength(9);');
          archive = archive.replace('getAllByText(state)).toHaveLength(8);', 'getAllByText(state)).toHaveLength(9);');
          archive = archive.replace('getAllByText(realUseProvenance)).toHaveLength(6);', 'getAllByText(realUseProvenance)).toHaveLength(7);');
          fs.writeFileSync(archivePath, archive);

          const shellPath = 'apps/web/src/components/site-shell.test.tsx';
          let shell = fs.readFileSync(shellPath, 'utf8');
          shell = shell.replace('"Tightening Contracts boundaries without distributing the architecture", "Catalog experience"', '"Tightening Contracts boundaries without distributing the architecture", "Hardening a cinematic WebGL experience for motion, accessibility, and reference fidelity", "Catalog experience"');
          shell = shell.replace('"Ajuste das fronteiras de Contracts sem distribuir a arquitetura", "Experiência do catálogo"', '"Ajuste das fronteiras de Contracts sem distribuir a arquitetura", "Hardening de uma experiência WebGL cinematográfica para motion, acessibilidade e fidelidade à referência", "Experiência do catálogo"');
          shell = shell.replace('(locale, heading, codebase, rocket, ping, portfolio, engineeringWorkflow, architectureEngineering, catalog, packs)', '(locale, heading, codebase, rocket, ping, portfolio, engineeringWorkflow, architectureEngineering, motion, catalog, packs)');
          shell = shell.replace('expect(screen.getByRole("heading", { name: architectureEngineering })).toBeInTheDocument();\n    expect(screen.getByRole("heading", { name: catalog }))', 'expect(screen.getByRole("heading", { name: architectureEngineering })).toBeInTheDocument();\n    expect(screen.getByRole("heading", { name: motion })).toBeInTheDocument();\n    expect(screen.getByRole("heading", { name: catalog }))');
          shell = shell.replace('querySelectorAll("[data-evidence-feature]")).toHaveLength(8);', 'querySelectorAll("[data-evidence-feature]")).toHaveLength(9);');
          fs.writeFileSync(shellPath, shell);
          NODE
      - name: Install web dependencies
        run: npm ci --prefix apps/web
      - name: Format touched web files
        run: ./apps/web/node_modules/.bin/prettier --write apps/web/src/lib/built-with-skills.ts apps/web/src/lib/built-with-skills.test.ts apps/web/src/lib/real-use-pack-coverage.test.ts apps/web/src/lib/roadmap.test.ts apps/web/src/components/evidence/evidence-archive.test.tsx apps/web/src/components/site-shell.test.tsx
      - name: Commit registry changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/lib/built-with-skills.ts apps/web/src/lib/built-with-skills.test.ts apps/web/src/lib/real-use-pack-coverage.test.ts apps/web/src/lib/roadmap.test.ts apps/web/src/components/evidence/evidence-archive.test.tsx apps/web/src/components/site-shell.test.tsx
          git commit -m "chore: apply Motion evidence registry"
          git push origin HEAD:feat/motion-real-use
