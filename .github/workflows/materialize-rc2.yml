name: Materialize RC2 catalogs

on:
  push:
    branches: [release/1.0.0-rc.2]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.0.0-rc.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchronize catalog record versions
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, readdir, writeFile } from "node:fs/promises";
          import path from "node:path";

          const manifest = JSON.parse(await readFile("catalog/catalog.json", "utf8"));
          for (const directory of ["catalog/skills", "catalog/packs"]) {
            const files = (await readdir(directory)).filter((file) => file.endsWith(".json")).sort();
            for (const file of files) {
              const target = path.join(directory, file);
              const record = JSON.parse(await readFile(target, "utf8"));
              record.version = manifest.version;
              await writeFile(target, `${JSON.stringify(record, null, 2)}\n`, "utf8");
            }
          }
          NODE
      - name: Verify RC2 root contract
        run: npm test
      - name: Generate canonical catalog
        run: npm run catalog:generate
      - name: Sync web catalog
        run: node apps/web/scripts/sync-catalog.mjs
      - name: Commit synchronized catalog state
        shell: bash
        run: |
          git add catalog/skills catalog/packs catalog/generated/catalog.json
          git add -f apps/web/src/generated/catalog.json
          if git diff --cached --quiet; then
            echo "Catalog state is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: synchronize RC2 catalog state"
          git push origin HEAD:release/1.0.0-rc.2
