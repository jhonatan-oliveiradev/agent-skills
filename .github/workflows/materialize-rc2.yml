name: Materialize RC2 catalogs

on:
  push:
    branches: [release/1.0.0-rc.2]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.0.0-rc.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify RC2 root contract
        run: npm test
      - name: Generate canonical catalog
        run: npm run catalog:generate
      - name: Sync web catalog
        run: node apps/web/scripts/sync-catalog.mjs
      - name: Commit generated projections
        shell: bash
        run: |
          git add catalog/generated/catalog.json apps/web/src/generated/catalog.json
          if git diff --cached --quiet; then
            echo "Generated catalogs are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: materialize RC2 catalogs"
          git push origin HEAD:release/1.0.0-rc.2
