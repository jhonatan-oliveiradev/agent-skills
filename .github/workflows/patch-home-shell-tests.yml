name: Update Home regression expectations

on:
  push:
    branches: [refactor/home-evidence-first-purple]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[home-test-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/home-evidence-first-purple
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update definitive Home expectations
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/web/src/components/site-shell.test.tsx';
          let source = fs.readFileSync(path, 'utf8');
          const replacements = [
            [
              '["en", "Skills are not prompts. They are working methods.", "18 skills", "6 packs", "2 locales", "Choose the right starting point", "Proof, not promises."],',
              '["en", "Skills are not prompts. They are working methods.", "18 skills", "6 packs", "2 locales", "This Home was built with Skills.", "Open the method. Inspect the evidence. Judge the result."],',
            ],
            [
              '["pt-BR", "Skills não são prompts. São métodos de trabalho.", "18 skills", "6 pacotes", "2 idiomas", "Escolha o ponto de partida", "Evidência, não promessas."],',
              '["pt-BR", "Skills não são prompts. São métodos de trabalho.", "18 skills", "6 pacotes", "2 idiomas", "Esta Home foi construída com Skills.", "Abra o método. Inspecione a evidência. Julgue o resultado."],',
            ],
            [
              'expect(container.querySelectorAll(".home-pack-card")).toHaveLength(3);',
              'expect(container.querySelectorAll(".home-pack-rail article")).toHaveLength(3);',
            ],
            [
              'expect(container.querySelectorAll(".home-case-card")).toHaveLength(2);',
              'expect(container.querySelectorAll(".home-method-index li")).toHaveLength(3);\n    expect(container.querySelectorAll(".home-workflow-rail li")).toHaveLength(4);',
            ],
          ];
          for (const [from, to] of replacements) {
            if (!source.includes(from) && !source.includes(to)) {
              throw new Error(`Expected test fragment not found: ${from}`);
            }
            source = source.replace(from, to);
          }
          fs.writeFileSync(path, source);
          NODE
      - name: Commit test update
        shell: bash
        run: |
          if git diff --quiet -- apps/web/src/components/site-shell.test.tsx; then
            echo "Home test expectations already updated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/site-shell.test.tsx
          git commit -m "test(web): update definitive Home expectations [home-test-patch]"
          git push origin HEAD:refactor/home-evidence-first-purple
