name: Hero visual QA

on:
  push:
    branches: [ci/hero-dark-veil-green]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run validate
      - run: npm ci --prefix apps/web
      - run: npm run web:test
      - run: npm run web:typecheck
      - run: npm run web:lint
      - run: npm run web:build
        env:
          NEXT_PUBLIC_SITE_URL: https://skills.jhonatanoliveira.com
      - name: Validate rendered hero and capture screenshots
        shell: bash
        run: |
          cd apps/web
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
          npm start > /tmp/agent-skills-next.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          ready=0
          for _ in {1..30}; do
            if curl -fsSL http://127.0.0.1:3000/pt-BR >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/agent-skills-next.log
            exit 1
          fi
          mkdir -p hero-qa
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const browser = await chromium.launch({ headless: true, args: ['--use-angle=swiftshader'] });
          const viewports = [
            { name: 'mobile-390', width: 390, height: 844 },
            { name: 'desktop-1440', width: 1440, height: 1000 },
            { name: 'desktop-1920', width: 1920, height: 1080 },
          ];

          for (const viewport of viewports) {
            const context = await browser.newContext({
              viewport: { width: viewport.width, height: viewport.height },
              colorScheme: 'dark',
              reducedMotion: 'no-preference',
              deviceScaleFactor: 1,
            });
            await context.addInitScript(() => localStorage.setItem('theme', 'dark'));
            const page = await context.newPage();
            const errors = [];
            page.on('console', (message) => {
              if (message.type() === 'error') errors.push(`console: ${message.text()}`);
            });
            page.on('pageerror', (error) => errors.push(`pageerror: ${error.message}`));

            await page.goto('http://127.0.0.1:3000/pt-BR', { waitUntil: 'networkidle' });
            await page.waitForTimeout(1800);

            assert.match(page.url(), /\/pt-BR\/?$/);
            assert.ok((await page.title()).trim().length > 0, 'page title must not be empty');
            assert.equal(await page.getByRole('heading', { level: 1 }).count(), 1);
            assert.match(await page.getByRole('heading', { level: 1 }).innerText(), /Skills não são prompts\./);
            assert.equal(await page.locator('nextjs-portal').count(), 0, 'framework error overlay present');
            assert.deepEqual(errors, [], `runtime errors at ${viewport.name}:\n${errors.join('\n')}`);

            await page.screenshot({ path: `hero-qa/${viewport.name}.png`, fullPage: false });
            await context.close();
          }

          const interactionContext = await browser.newContext({
            viewport: { width: 1440, height: 1000 },
            colorScheme: 'dark',
            reducedMotion: 'no-preference',
          });
          await interactionContext.addInitScript(() => localStorage.setItem('theme', 'dark'));
          const interactionPage = await interactionContext.newPage();
          const interactionErrors = [];
          interactionPage.on('console', (message) => {
            if (message.type() === 'error') interactionErrors.push(`console: ${message.text()}`);
          });
          interactionPage.on('pageerror', (error) => interactionErrors.push(`pageerror: ${error.message}`));
          await interactionPage.goto('http://127.0.0.1:3000/pt-BR', { waitUntil: 'networkidle' });
          await Promise.all([
            interactionPage.waitForURL(/\/pt-BR\/getting-started\/?$/),
            interactionPage.getByRole('link', { name: 'Ver o método' }).click(),
          ]);
          assert.match(interactionPage.url(), /\/pt-BR\/getting-started\/?$/);
          assert.deepEqual(interactionErrors, [], `runtime errors after CTA interaction:\n${interactionErrors.join('\n')}`);
          await interactionContext.close();

          await browser.close();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: hero-dark-veil-qa-final
          path: apps/web/hero-qa/*.png
          if-no-files-found: error
