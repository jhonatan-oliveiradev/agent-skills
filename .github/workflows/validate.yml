name: Regenerate Application Security catalog

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate deterministic catalog
        run: npm run catalog:generate
      - name: Commit generated catalog
        shell: bash
        run: |
          if git diff --quiet -- catalog/generated/catalog.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/generated/catalog.json
          git commit -m "chore: regenerate catalog for Application Security"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
