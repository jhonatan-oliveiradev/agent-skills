name: Materialize selecting-working-methods web counts

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Update large web count contracts
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'apps/web/src/components/site-shell.test.tsx';
          let source = fs.readFileSync(file, 'utf8');
          const replacements = [
            ['"38 skills", "8 packs"', '"39 skills", "8 packs"'],
            ['"38 skills", "8 pacotes"', '"39 skills", "8 pacotes"'],
            ['"38 skills prontas para usar."', '"39 skills prontas para usar."'],
            ['expect(container.querySelectorAll("[data-method-row]")).toHaveLength(38);', 'expect(container.querySelectorAll("[data-method-row]")).toHaveLength(39);'],
          ];
          for (const [before, after] of replacements) {
            if (!source.includes(before)) throw new Error(`Expected text not found: ${before}`);
            source = source.replace(before, after);
          }
          fs.writeFileSync(file, source);
          NODE
      - name: Commit web count contracts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/site-shell.test.tsx
          git commit -m "test: align site shell with 39 methods"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
