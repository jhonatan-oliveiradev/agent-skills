name: Materialize Design & Brand catalog

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate canonical catalog snapshot
        run: npm run catalog:generate
      - name: Commit generated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/generated/catalog.json
          git diff --cached --quiet && { echo "Expected generated catalog change"; exit 1; }
          git commit -m "chore: regenerate Design & Brand catalog"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
