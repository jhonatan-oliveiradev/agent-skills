name: Validate skills

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize-rc1-test-contract:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/release-readiness-rc1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Align stale RC1 version assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/components/site-shell.test.tsx')
          text = path.read_text(encoding='utf-8')
          old = '1.0.0-beta.1'
          new = '1.0.0-rc.1'
          old_count = text.count(old)
          new_count = text.count(new)
          if old_count == 0 and new_count == 3:
              raise SystemExit(0)
          if old_count != 3:
              raise SystemExit(f'expected exactly 3 stale assertions, found {old_count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/site-shell.test.tsx
          git diff --cached --quiet && exit 0
          git commit -m "test: align site shell with RC1 version"
          git push origin HEAD:${{ github.head_ref }}
