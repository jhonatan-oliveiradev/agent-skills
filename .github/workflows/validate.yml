name: Materialize brand-design validator

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add brand-design to validator allowlist
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const file = 'scripts/validate-catalog.mjs';
          const source = await readFile(file, 'utf8');
          const before = '"engineering-workflow", "delivery", "meta"';
          const after = '"engineering-workflow", "brand-design", "delivery", "meta"';
          if (!source.includes(before)) throw new Error('validator category anchor not found');
          await writeFile(file, source.replace(before, after));
          NODE
      - name: Commit materialized validator change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate-catalog.mjs
          git commit -m "feat: register brand-design catalog category"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
