name: Validate skills

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize architecture category validator
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'scripts/validate-catalog.mjs';
          const before = '"game-development", "backend-data", "delivery", "meta"';
          const after = '"game-development", "backend-data", "architecture-engineering", "delivery", "meta"';
          let source = fs.readFileSync(file, 'utf8');
          if (!source.includes(after)) {
            if (!source.includes(before)) throw new Error('Expected validator category sequence not found');
            source = source.replace(before, after);
            fs.writeFileSync(file, source);
          }
          NODE
      - name: Commit materialized validator
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if git diff --quiet -- scripts/validate-catalog.mjs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate-catalog.mjs
          git commit -m "feat: allow architecture-engineering catalog category"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - run: npm test
      - run: npm run validate
      - run: npm ci --prefix apps/web
      - run: npm run web:test
      - run: npm run web:typecheck
      - run: npm run web:lint
      - run: npm run web:build
        env:
          NEXT_PUBLIC_SITE_URL: https://skills.jhonatanoliveira.com
      - name: Smoke test Bash installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          target="$(mktemp -d)"
          pack_target="$(mktemp -d)"
          ./install.sh --destination "$target"
          ./install.sh --destination "$pack_target" --pack motion
          test -f "$target/craft-premium-motion/SKILL.md"
          test -f "$pack_target/craft-premium-motion/SKILL.md"
          test ! -e "$pack_target/designing-action-combat/SKILL.md"
      - name: Smoke test PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "agent-skills-install"
          ./install.ps1 --destination $target
          if (-not (Test-Path (Join-Path $target "craft-premium-motion/SKILL.md"))) { exit 1 }
          $packTarget = Join-Path $env:RUNNER_TEMP "agent-skills-motion-pack"
          ./install.ps1 --destination $packTarget --pack motion
          if (-not (Test-Path (Join-Path $packTarget "craft-premium-motion/SKILL.md"))) { exit 1 }
          if (Test-Path (Join-Path $packTarget "designing-action-combat/SKILL.md")) { exit 1 }
