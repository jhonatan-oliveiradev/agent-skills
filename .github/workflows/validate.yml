name: Materialize Design & Brand counts

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align repository count contracts
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          async function replaceExact(file, before, after) {
            const source = await readFile(file, 'utf8');
            if (!source.includes(before)) throw new Error(`${file}: anchor not found`);
            await writeFile(file, source.replace(before, after));
          }
          await replaceExact(
            'scripts/bootstrap-project.test.mjs',
            'assert.equal(result.skillsInstalled, 39);',
            'assert.equal(result.skillsInstalled, 44);',
          );
          await replaceExact(
            'scripts/validate-catalog.test.mjs',
            '    skillCount: 39,\n    packCount: 8,\n    activePackCount: 8,',
            '    skillCount: 44,\n    packCount: 9,\n    activePackCount: 9,',
          );
          NODE
      - name: Commit materialized count changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/bootstrap-project.test.mjs scripts/validate-catalog.test.mjs
          git commit -m "test: align Design & Brand catalog counts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
