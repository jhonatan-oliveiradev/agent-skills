name: Normalize Rocket case formatting

on:
  push:
    branches: [feat/real-use-case-003-stable-readiness]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize inserted case indentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/web/src/lib/built-with-skills.ts")
          text = path.read_text(encoding="utf-8")
          start = text.index('  {\n  slug: "rocket-editorial-error-boundary"')
          end = text.index('\n  {\n    slug: "ping-space-voice-membership-authorization"', start)
          block = text[start:end]
          lines = block.splitlines()
          normalized = "\n".join([lines[0], *["  " + line for line in lines[1:]]])
          path.write_text(text[:start] + normalized + text[end:], encoding="utf-8")
          PY
      - name: Commit formatting normalization
        shell: bash
        run: |
          if git diff --quiet -- apps/web/src/lib/built-with-skills.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/lib/built-with-skills.ts
          git commit -m "style: normalize Rocket evidence case"
          git push origin HEAD:feat/real-use-case-003-stable-readiness
