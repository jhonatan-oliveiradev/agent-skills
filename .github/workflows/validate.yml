name: Materialize Rocket shell expectations

on:
  push:
    branches: [feat/real-use-case-003-stable-readiness]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update derived shell contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/web/src/components/site-shell.test.tsx")
          text = path.read_text(encoding="utf-8")

          old = '''  it.each([
            ["en", "Don't trust the description. Inspect the result.", "Hardening Space voice credential authorization", "Hardening a translation provider after a production incident", "Catalog experience", "Pack experience"],
            ["pt-BR", "Não confie na descrição. Inspecione o resultado.", "Hardening da autorização de credenciais de voz em Spaces", "Hardening de um provider de tradução após um incidente em produção", "Experiência do catálogo", "Experiência dos pacotes"],
          ] as const)("renders the evidence archive for %s", async (locale, heading, ping, portfolio, catalog, packs) => {
            const { container } = render(
              await BuiltWithSkillsPage({ params: Promise.resolve({ locale }) }),
            );

            expect(screen.getByRole("heading", { level: 1, name: heading })).toBeInTheDocument();
            expect(screen.getByRole("heading", { name: ping })).toBeInTheDocument();
            expect(screen.getByRole("heading", { name: portfolio })).toBeInTheDocument();
            expect(screen.getByRole("heading", { name: catalog })).toBeInTheDocument();
            expect(screen.getByRole("heading", { name: packs })).toBeInTheDocument();
            expect(container.querySelectorAll("[data-evidence-feature]")).toHaveLength(4);
            expect(container.querySelector(".built-case-card")).not.toBeInTheDocument();
          });'''

          new = '''  it.each([
            ["en", "Don't trust the description. Inspect the result.", "Shipping a recoverable Rocket error state through real Studio consumption", "Hardening Space voice credential authorization", "Hardening a translation provider after a production incident", "Catalog experience", "Pack experience"],
            ["pt-BR", "Não confie na descrição. Inspecione o resultado.", "Entrega de um estado de erro recuperável no Rocket com consumo real do Studio", "Hardening da autorização de credenciais de voz em Spaces", "Hardening de um provider de tradução após um incidente em produção", "Experiência do catálogo", "Experiência dos pacotes"],
          ] as const)("renders the evidence archive for %s", async (locale, heading, rocket, ping, portfolio, catalog, packs) => {
            const { container } = render(
              await BuiltWithSkillsPage({ params: Promise.resolve({ locale }) }),
            );

            expect(screen.getByRole("heading", { level: 1, name: heading })).toBeInTheDocument();
            expect(screen.getByRole("heading", { name: rocket })).toBeInTheDocument();
            expect(screen.getByRole("heading", { name: ping })).toBeInTheDocument();
            expect(screen.getByRole("heading", { name: portfolio })).toBeInTheDocument();
            expect(screen.getByRole("heading", { name: catalog })).toBeInTheDocument();
            expect(screen.getByRole("heading", { name: packs })).toBeInTheDocument();
            expect(container.querySelectorAll("[data-evidence-feature]")).toHaveLength(5);
            expect(container.querySelector(".built-case-card")).not.toBeInTheDocument();
          });'''

          if old not in text:
              raise SystemExit("site-shell evidence block not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit materialized expectation
        shell: bash
        run: |
          if git diff --quiet -- apps/web/src/components/site-shell.test.tsx; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/site-shell.test.tsx
          git commit -m "test: include Rocket in shell evidence archive"
          git push origin HEAD:feat/real-use-case-003-stable-readiness
