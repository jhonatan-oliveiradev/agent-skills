name: Materialize Quality & Testing invariants

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Update catalog invariants
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const replacements = [
            {
              file: 'scripts/validate-catalog.mjs',
              before: '"backend-data", "architecture-engineering", "delivery", "meta"',
              after: '"backend-data", "architecture-engineering", "quality-testing", "delivery", "meta"',
            },
            {
              file: 'scripts/bootstrap-project.test.mjs',
              before: 'assert.equal(result.skillsInstalled, 26);',
              after: 'assert.equal(result.skillsInstalled, 30);',
            },
            {
              file: 'scripts/validate-catalog.test.mjs',
              before: 'skillCount: 26,\n    packCount: 6,\n    activePackCount: 5,',
              after: 'skillCount: 30,\n    packCount: 6,\n    activePackCount: 6,',
            },
          ];
          for (const { file, before, after } of replacements) {
            let source = fs.readFileSync(file, 'utf8');
            if (!source.includes(before)) throw new Error(`Expected text not found in ${file}: ${before}`);
            source = source.replace(before, after);
            fs.writeFileSync(file, source);
          }
          NODE
      - name: Commit invariant updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate-catalog.mjs scripts/bootstrap-project.test.mjs scripts/validate-catalog.test.mjs
          git commit -m "test: align catalog invariants with Quality & Testing"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
