name: Materialize Application Security validator

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Add application-security to validator allowlist
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'scripts/validate-catalog.mjs';
          let source = fs.readFileSync(file, 'utf8');
          const before = '"architecture-engineering", "quality-testing", "delivery"';
          const after = '"architecture-engineering", "quality-testing", "application-security", "delivery"';
          if (source.includes(before)) {
            source = source.replace(before, after);
            fs.writeFileSync(file, source);
          } else if (!source.includes(after)) {
            throw new Error('Expected validator category sequence not found');
          }
          NODE
      - name: Commit validator change
        shell: bash
        run: |
          if git diff --quiet -- scripts/validate-catalog.mjs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate-catalog.mjs
          git commit -m "feat: validate application security category"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
