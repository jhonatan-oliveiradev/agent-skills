name: Materialize live catalog expectations

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update live catalog expectations
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'apps/web/src/components/site-shell.test.tsx';
          let source = fs.readFileSync(file, 'utf8');
          const replacements = [
            ['22 skills', '26 skills'],
            ['expect(container.querySelectorAll(".home-pack-dossier")).toHaveLength(4);', 'expect(container.querySelectorAll(".home-pack-dossier")).toHaveLength(5);'],
          ];
          for (const [before, after] of replacements) {
            if (!source.includes(before)) throw new Error(`Expected text not found: ${before}`);
            source = source.split(before).join(after);
          }
          fs.writeFileSync(file, source);
          NODE
      - name: Commit expectations
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/site-shell.test.tsx
          git commit -m "test: reflect expanded live catalog surfaces"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
