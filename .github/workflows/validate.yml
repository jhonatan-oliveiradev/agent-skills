name: Materialize architecture documentation

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update current-state documentation
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceRequired(source, before, after, file) {
            if (!source.includes(before)) throw new Error(`${file}: expected text not found: ${before.slice(0, 100)}`);
            return source.replace(before, after);
          }

          {
            const file = 'README.md';
            let source = fs.readFileSync(file, 'utf8');
            source = replaceRequired(
              source,
              'A curated Agent Skills library for production frontend, product design, motion, visual QA, delivery workflows, backend and data engineering, and game-development tasks.',
              'A curated Agent Skills library for production frontend, product design, motion, visual QA, delivery workflows, backend and data engineering, software architecture and engineering, and game-development tasks.',
              file,
            );
            source = replaceRequired(
              source,
              '### Delivery & knowledge capture\n- `shipping-github-vercel-changes`',
              '### Architecture & engineering\n- `choosing-application-architecture`\n- `designing-software-boundaries`\n- `documenting-architecture-decisions`\n- `planning-safe-refactors`\n\n### Delivery & knowledge capture\n- `shipping-github-vercel-changes`',
              file,
            );
            source = replaceRequired(
              source,
              'The methods prefer database constraints and measured access patterns over speculative abstraction, use compatibility-first production migration strategies, and require execution evidence before query/index recommendations.\n\n## New web-app default',
              'The methods prefer database constraints and measured access patterns over speculative abstraction, use compatibility-first production migration strategies, and require execution evidence before query/index recommendations.\n\n## Architecture & Engineering v1\n\nThe Architecture & Engineering pack is deliberately topology- and runtime-agnostic. It separates four concerns that should remain independently invokable: choosing application architecture from real quality attributes and constraints, designing cohesive software boundaries, documenting significant decisions with ADRs, and planning structural refactors as releasable migration slices.\n\nThe methods prefer the least distributed architecture that satisfies demonstrated forces, explicit ownership and dependency direction, durable decision rationale, and incremental evolution with verification and rollback. They do not require CodeGraph or another code-intelligence runtime.\n\n## New web-app default',
              file,
            );
            source = replaceRequired(
              source,
              '- `backend-data` — Backend & Data (4 skills).\n\nThe catalog also publishes two roadmap packs that are not yet installable:\n`architecture-engineering` (Architecture & Engineering) and `quality-testing`\n(Quality & Testing).',
              '- `backend-data` — Backend & Data (4 skills);\n- `architecture-engineering` — Architecture & Engineering (4 skills).\n\nThe catalog also publishes one roadmap pack that is not yet installable:\n`quality-testing` (Quality & Testing).',
              file,
            );
            source = replaceRequired(
              source,
              '- `backend-data` — Backend e Dados (4 skills).\n\nO catálogo também publica dois pacotes planejados, ainda não instaláveis:\n`architecture-engineering` (Arquitetura e Engenharia) e `quality-testing`\n(Qualidade e Testes).',
              '- `backend-data` — Backend e Dados (4 skills);\n- `architecture-engineering` — Arquitetura e Engenharia (4 skills).\n\nO catálogo também publica um pacote planejado, ainda não instalável:\n`quality-testing` (Qualidade e Testes).',
              file,
            );
            source = replaceRequired(
              source,
              'specialized workflows such as UI fidelity, motion, visual QA, backend/data engineering, and delivery.',
              'specialized workflows such as UI fidelity, motion, visual QA, backend/data engineering, architecture, and delivery.',
              file,
            );
            source = replaceRequired(
              source,
              'plus official PostgreSQL and Node.js documentation and the OWASP API Security Top 10 used as references for Backend & Data v1.',
              'plus official PostgreSQL and Node.js documentation, the OWASP API Security Top 10, SEI and Microsoft architecture guidance, AWS architectural decision records, and Martin Fowler refactoring patterns used as references for the engineering methods.',
              file,
            );
            fs.writeFileSync(file, source);
          }

          {
            const file = 'MAPPING.md';
            let source = fs.readFileSync(file, 'utf8');
            source = replaceRequired(
              source,
              '| Architecture & Engineering (`architecture-engineering`) | Planned | No members until the category is implemented |',
              '| Architecture & Engineering (`architecture-engineering`) | Active | 4 architecture-selection, software-boundary, ADR, and safe-refactoring skills |',
              file,
            );
            source = replaceRequired(
              source,
              '### `profiling-postgres-query-performance`\nAdded for evidence-led PostgreSQL query diagnosis using representative inputs and execution plans before changing SQL or indexes.\n\n## Why the 81 web-design skills were not installed individually',
              '### `profiling-postgres-query-performance`\nAdded for evidence-led PostgreSQL query diagnosis using representative inputs and execution plans before changing SQL or indexes.\n\n### `choosing-application-architecture`\nAdded for architecture selection driven by quality attributes, change boundaries, deployment constraints, and operational capability rather than pattern preference.\n\n### `designing-software-boundaries`\nAdded for shaping cohesive ownership, state, contracts, and dependency direction without conflating internal structural boundaries with external API trust boundaries.\n\n### `documenting-architecture-decisions`\nAdded for concise ADRs that preserve context, decision drivers, alternatives, consequences, and explicit review triggers.\n\n### `planning-safe-refactors`\nAdded for converting broad structural changes into releasable migration slices with seams, regression evidence, rollback paths, and cleanup conditions.\n\n## Why the 81 web-design skills were not installed individually',
              file,
            );
            source += '\n## Architecture & Engineering research — 2026-09-01\n\n| Source | Decision | Local destination |\n|---|---|---|\n| SEI guidance on software architecture quality attributes | Referenced | `skills/choosing-application-architecture` |\n| Microsoft architectural principles | Referenced | `skills/choosing-application-architecture` + `skills/designing-software-boundaries` |\n| AWS guidance on cohesion and coupling | Referenced | `skills/designing-software-boundaries` |\n| AWS architectural decision record process | Referenced | `skills/documenting-architecture-decisions` + `skills/choosing-application-architecture` |\n| Martin Fowler, Branch by Abstraction | Referenced | `skills/planning-safe-refactors` |\n| Martin Fowler, Strangler Fig modernization | Referenced | `skills/planning-safe-refactors` |\n\nArchitecture & Engineering v1 does not mirror those sources or require a graph-analysis runtime. The local methods combine stable decision and migration procedures while remaining usable with the agent\'s native repository tools.\n';
            fs.writeFileSync(file, source);
          }
          NODE
      - name: Commit documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md MAPPING.md
          git commit -m "docs: document Architecture & Engineering v1"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
