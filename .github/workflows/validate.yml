name: Materialize Engineering Workflow web integration

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Update large web contracts and create domain test
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replace(file, before, after) {
            let source = fs.readFileSync(file, 'utf8');
            if (!source.includes(before)) throw new Error(`Expected text not found in ${file}: ${before}`);
            source = source.replace(before, after);
            fs.writeFileSync(file, source);
          }

          const shell = 'apps/web/src/components/site-shell.test.tsx';
          replace(shell,
            '["en", "Skills are not prompts. They are working methods.", "34 skills", "7 packs", "2 locales", "This Home was built with Skills.", "Open the method. Inspect the evidence. Judge the result."],',
            '["en", "Skills are not prompts. They are working methods.", "38 skills", "8 packs", "2 locales", "This Home was built with Skills.", "Open the method. Inspect the evidence. Judge the result."],'
          );
          replace(shell,
            '["pt-BR", "Skills não são prompts. São métodos de trabalho.", "34 skills", "7 pacotes", "2 idiomas", "Esta Home foi construída com Skills.", "Abra o método. Inspecione a evidência. Julgue o resultado."],',
            '["pt-BR", "Skills não são prompts. São métodos de trabalho.", "38 skills", "8 pacotes", "2 idiomas", "Esta Home foi construída com Skills.", "Abra o método. Inspecione a evidência. Julgue o resultado."],'
          );
          replace(shell,
            'expect(container.querySelectorAll(".home-pack-dossier")).toHaveLength(7);',
            'expect(container.querySelectorAll(".home-pack-dossier")).toHaveLength(8);'
          );
          replace(shell,
            'expect(screen.getByText("34 skills prontas para usar.")).toBeInTheDocument();',
            'expect(screen.getByText("38 skills prontas para usar.")).toBeInTheDocument();'
          );
          replace(shell,
            'expect(container.querySelectorAll("[data-pack-dossier]")).toHaveLength(7);',
            'expect(container.querySelectorAll("[data-pack-dossier]")).toHaveLength(8);'
          );
          replace(shell,
            'expect(container.querySelectorAll(\'[data-pack-dossier][data-status="active"]\')).toHaveLength(7);',
            'expect(container.querySelectorAll(\'[data-pack-dossier][data-status="active"]\')).toHaveLength(8);'
          );
          replace(shell,
            'expect(container.querySelectorAll("[data-method-row]")).toHaveLength(34);',
            'expect(container.querySelectorAll("[data-method-row]")).toHaveLength(38);'
          );

          const css = 'apps/web/src/app/home-living-systems.css';
          replace(css,
            '.home-pack-dossier:nth-child(7) {\n  grid-column: 1 / span 7;\n  margin-top: clamp(3rem, 7vw, 7rem);\n}\n',
            '.home-pack-dossier:nth-child(7) {\n  grid-column: 1 / span 7;\n  margin-top: clamp(3rem, 7vw, 7rem);\n}\n\n.home-pack-dossier:nth-child(8) {\n  grid-column: 6 / span 7;\n  margin-top: clamp(6rem, 11vw, 11rem);\n}\n'
          );
          replace(css,
            '  .home-pack-dossier:nth-child(6),\n  .home-pack-dossier:nth-child(7) {',
            '  .home-pack-dossier:nth-child(6),\n  .home-pack-dossier:nth-child(7),\n  .home-pack-dossier:nth-child(8) {'
          );

          const testFile = 'apps/web/src/components/skills/engineering-workflow-methods.test.tsx';
          if (fs.existsSync(testFile)) throw new Error(`${testFile} already exists`);
          fs.writeFileSync(testFile, `import { render, screen } from "@testing-library/react";\nimport { describe, expect, it, vi } from "vitest";\nimport { NuqsTestingAdapter } from "nuqs/adapters/testing";\n\nvi.mock("server-only", () => ({}));\n\nimport SkillsPage from "@/app/[locale]/skills/page";\n\ndescribe("Engineering Workflow methods", () => {\n  it.each([\n    ["en", "Engineering workflow"],\n    ["pt-BR", "Fluxo de engenharia"],\n  ] as const)("publishes the localized engineering-workflow domain for %s", async (locale, label) => {\n    render(\n      <NuqsTestingAdapter>\n        {await SkillsPage({ params: Promise.resolve({ locale }) })}\n      </NuqsTestingAdapter>,\n    );\n\n    expect(screen.getByRole("button", { name: label })).toBeInTheDocument();\n  });\n});\n`);
          NODE
      - name: Commit web integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/site-shell.test.tsx apps/web/src/app/home-living-systems.css apps/web/src/components/skills/engineering-workflow-methods.test.tsx
          git commit -m "feat: integrate Engineering Workflow into the web archive"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
