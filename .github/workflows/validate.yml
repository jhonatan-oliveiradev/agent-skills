name: Materialize Engineering Workflow validator

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Update validator category allowlist
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'scripts/validate-catalog.mjs';
          const before = '"quality-testing", "application-security", "delivery", "meta"';
          const after = '"quality-testing", "application-security", "engineering-workflow", "delivery", "meta"';
          let source = fs.readFileSync(file, 'utf8');
          if (!source.includes(before)) throw new Error('Expected validator category sequence not found');
          source = source.replace(before, after);
          fs.writeFileSync(file, source);
          NODE
      - name: Commit validator
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate-catalog.mjs
          git commit -m "feat: recognize Engineering Workflow catalog category"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
