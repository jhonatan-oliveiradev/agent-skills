name: Materialize final web expectations

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update stale site-shell expectations
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'apps/web/src/components/site-shell.test.tsx';
          let source = fs.readFileSync(file, 'utf8');
          const replacements = [
            ['expect(container.querySelectorAll("[data-program-record]")).toHaveLength(7);', 'expect(container.querySelectorAll("[data-program-record]")).toHaveLength(6);'],
            ['expect(container.querySelectorAll(\'[data-pack-dossier][data-status="active"]\')).toHaveLength(4);', 'expect(container.querySelectorAll(\'[data-pack-dossier][data-status="active"]\')).toHaveLength(5);'],
            ['expect(container.querySelectorAll(\'[data-pack-dossier][data-status="planned"]\')).toHaveLength(2);', 'expect(container.querySelectorAll(\'[data-pack-dossier][data-status="planned"]\')).toHaveLength(1);'],
            ['expect(container.querySelectorAll("[data-method-row]")).toHaveLength(22);', 'expect(container.querySelectorAll("[data-method-row]")).toHaveLength(26);'],
          ];
          for (const [before, after] of replacements) {
            if (!source.includes(before)) throw new Error(`Expected text not found: ${before}`);
            source = source.replace(before, after);
          }
          fs.writeFileSync(file, source);
          NODE
      - name: Commit expectations
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/site-shell.test.tsx
          git commit -m "test: align shell contracts with architecture catalog"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
