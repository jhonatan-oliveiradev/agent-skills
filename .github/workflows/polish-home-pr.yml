name: Apply Home PR polish

on:
  push:
    branches: [refactor/home-evidence-first-purple]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[home-polish]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/home-evidence-first-purple
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove dead pack accent plumbing and harden external link
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/web/src/app/[locale]/page.tsx';
          let source = fs.readFileSync(path, 'utf8');
          source = source.replace('import type { CSSProperties } from "react";\n', '');
          source = source.replace(
            `              <article\n                key={pack.slug}\n                style={{ "--pack-accent": pack.color } as CSSProperties}\n              >`,
            `              <article key={pack.slug}>`,
          );
          source = source.replace('rel="noreferrer" target="_blank"', 'rel="noreferrer noopener" target="_blank"');
          fs.writeFileSync(path, source);
          NODE
      - name: Commit polish
        shell: bash
        run: |
          if git diff --quiet -- apps/web/src/app/'[locale]'/page.tsx; then
            echo "Home polish already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/'[locale]'/page.tsx
          git commit -m "refactor(web): polish Home evidence markup [home-polish]"
          git push origin HEAD:refactor/home-evidence-first-purple
