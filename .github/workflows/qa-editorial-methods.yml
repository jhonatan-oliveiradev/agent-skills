name: QA Editorial Methods

on:
  push:
    branches:
      - refactor/editorial-methods-system

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright for temporary rendered QA
        working-directory: apps/web
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build production app
        working-directory: apps/web
        run: npm run build

      - name: Start production app
        working-directory: apps/web
        run: |
          nohup npm start -- -p 3000 > /tmp/agent-skills-web.log 2>&1 &
          echo $! > /tmp/agent-skills-web.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/pt-BR/skills > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/agent-skills-web.log
          exit 1

      - name: Render and validate editorial methods
        working-directory: apps/web
        run: |
          mkdir -p .qa-methods
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          import { writeFileSync } from "node:fs";

          const browser = await chromium.launch({ headless: true });
          const baseURL = "http://127.0.0.1:3000";
          const report = { pages: [], errors: [] };

          async function capture(name, path, options = {}) {
            const context = await browser.newContext({
              viewport: options.viewport ?? { width: 1440, height: 1000 },
              colorScheme: options.colorScheme ?? "dark",
              reducedMotion: options.reducedMotion ?? "no-preference",
            });
            const page = await context.newPage();
            const runtimeErrors = [];

            page.on("pageerror", (error) => runtimeErrors.push(`pageerror: ${error.message}`));
            page.on("console", (message) => {
              if (message.type() === "error") runtimeErrors.push(`console: ${message.text()}`);
            });

            const response = await page.goto(`${baseURL}${path}`, { waitUntil: "networkidle" });
            if (!response?.ok()) throw new Error(`${name}: HTTP ${response?.status()}`);

            const metrics = await page.evaluate(() => ({
              clientWidth: document.documentElement.clientWidth,
              scrollWidth: document.documentElement.scrollWidth,
              headerCount: document.querySelectorAll("body > div header, body > header, header[data-site-chrome]").length,
              footerCount: document.querySelectorAll("footer[data-footer-mode]").length,
            }));

            if (metrics.scrollWidth > metrics.clientWidth + 1) {
              const offenders = await page.evaluate(() =>
                [...document.querySelectorAll("body *")]
                  .map((element) => {
                    const rect = element.getBoundingClientRect();
                    return {
                      tag: element.tagName.toLowerCase(),
                      cls: typeof element.className === "string" ? element.className : "",
                      left: Math.round(rect.left),
                      right: Math.round(rect.right),
                      width: Math.round(rect.width),
                    };
                  })
                  .filter((item) => item.right > document.documentElement.clientWidth + 1 || item.left < -1)
                  .slice(0, 12),
              );
              throw new Error(`${name}: horizontal overflow ${JSON.stringify({ metrics, offenders })}`);
            }

            const chrome = await page.evaluate(() => ({
              headers: document.querySelectorAll('header[data-site-chrome="publication-bar"]').length,
              footers: document.querySelectorAll('footer[data-footer-mode="end-matter"]').length,
            }));
            if (chrome.headers !== 1 || chrome.footers !== 1) {
              throw new Error(`${name}: expected one global header/footer, got ${JSON.stringify(chrome)}`);
            }

            if (path.endsWith("/skills")) {
              const rows = await page.locator("[data-method-row]").count();
              if (rows !== 18) throw new Error(`${name}: expected 18 method rows, got ${rows}`);
            }

            if (path.includes("/skills/designing-ui-systems")) {
              await page.locator('[data-method-dossier="hero"]').waitFor();
              await page.locator('[data-method-dossier="benefit"]').waitFor();
              const prompts = await page.locator("[data-prompt-specimen]").count();
              if (prompts < 1) throw new Error(`${name}: expected prompt specimens`);

              const anchors = await page.locator("[data-method-reader] nav a").evaluateAll((links) =>
                links.map((link) => link.getAttribute("href")),
              );
              for (const href of anchors) {
                if (!href?.startsWith("#") || !(await page.locator(href).count())) {
                  throw new Error(`${name}: broken reader anchor ${href}`);
                }
              }
            }

            if (runtimeErrors.length) {
              throw new Error(`${name}: runtime errors ${JSON.stringify(runtimeErrors)}`);
            }

            await page.screenshot({ path: `.qa-methods/${name}.png`, fullPage: true });
            report.pages.push({ name, path, metrics });
            await context.close();
          }

          try {
            await capture("desktop-archive-dark", "/pt-BR/skills");
            await capture("mobile-archive-dark", "/pt-BR/skills", { viewport: { width: 390, height: 844 } });
            await capture("desktop-dossier-dark", "/pt-BR/skills/designing-ui-systems");
            await capture("mobile-dossier-dark", "/pt-BR/skills/designing-ui-systems", { viewport: { width: 390, height: 844 } });
            await capture("desktop-dossier-light", "/pt-BR/skills/designing-ui-systems", { colorScheme: "light" });
            await capture("desktop-dossier-reduced-motion", "/pt-BR/skills/designing-ui-systems", { reducedMotion: "reduce" });
          } catch (error) {
            report.errors.push(error instanceof Error ? error.message : String(error));
          } finally {
            writeFileSync(".qa-methods/report.json", JSON.stringify(report, null, 2));
            await browser.close();
          }

          if (report.errors.length) {
            console.error(report.errors.join("\n"));
            process.exit(1);
          }
          NODE

      - name: Upload rendered QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-methods-rendered-qa
          path: apps/web/.qa-methods
          if-no-files-found: error
