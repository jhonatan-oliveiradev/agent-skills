name: Install Living Archive GSAP dependencies

on:
  push:
    branches: [fix/home-living-archive-scroll-choreography]

permissions:
  contents: write

jobs:
  install:
    if: ${{ !contains(github.event.head_commit.message, '[gsap-deps]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-living-archive-scroll-choreography
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned GSAP packages
        run: npm install --prefix apps/web --save-exact gsap@3.15.0 @gsap/react@2.1.2
      - name: Commit dependency lock update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json apps/web/package-lock.json
          git commit -m "chore(web): add GSAP scroll dependencies [gsap-deps]"
          git push origin HEAD:fix/home-living-archive-scroll-choreography
