name: Materialize Codebase Intelligence real-use case

on:
  push:
    branches: [evidence/codebase-intelligence-real-use]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evidence/codebase-intelligence-real-use
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Insert public-safe Rocket case
        env:
          CONST_MARKER_B64: Y29uc3Qgcm9ja2V0Q2FzZVNvdXJjZVBhdGggPQogICJkb2NzL2J1aWx0LXdpdGgtc2tpbGxzLzIwMjYtMDktMDItcm9ja2V0LWVkaXRvcmlhbC1lcnJvci1ib3VuZGFyeS5tZCI7Cg==
          CONST_INSERT_B64: Y29uc3Qgcm9ja2V0Q29kZWJhc2VDYXNlU291cmNlUGF0aCA9CiAgImRvY3MvYnVpbHQtd2l0aC1za2lsbHMvMjAyNi0wOS0wMi1yb2NrZXQtY29kZWJhc2UtaW50ZWxsaWdlbmNlLWNvc21pYy1zZGstcmVtb3ZhbC5tZCI7Cg==
          CASE_INSERT_B64: 
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const decode = (value) => Buffer.from(value, "base64").toString("utf8");
          const path = "apps/web/src/lib/built-with-skills.ts";
          let source = await readFile(path, "utf8");
          const constMarker = decode(process.env.CONST_MARKER_B64);
          const constInsert = decode(process.env.CONST_INSERT_B64);
          const caseInsert = decode(process.env.CASE_INSERT_B64);
          if (!source.includes("rocketCodebaseCaseSourcePath")) {
            if (!source.includes(constMarker)) throw new Error("rocket source-path marker not found");
            source = source.replace(constMarker, constInsert + constMarker);
          }
          if (!source.includes('slug: "rocket-codebase-intelligence-cosmic-sdk-removal"')) {
            const marker = "const cases = [\n";
            if (!source.includes(marker)) throw new Error("cases marker not found");
            source = source.replace(marker, marker + caseInsert);
          }
          await writeFile(path, source, "utf8");
          NODE
      - name: Verify web evidence contracts
        run: |
          npm ci --prefix apps/web
          npm run web:test
      - name: Commit materialized case only
        shell: bash
        run: |
          git add apps/web/src/lib/built-with-skills.ts
          if git diff --cached --quiet; then
            echo "Case is already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "evidence(web): publish Rocket Codebase Intelligence case"
          git push origin HEAD:evidence/codebase-intelligence-real-use
