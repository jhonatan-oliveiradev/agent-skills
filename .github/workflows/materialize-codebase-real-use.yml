name: Materialize Codebase Intelligence real-use case

on:
  push:
    branches: [evidence/codebase-intelligence-real-use]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evidence/codebase-intelligence-real-use
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Insert public-safe Rocket case and sync archive contract
        env:
          CONST_MARKER_B64: Y29uc3Qgcm9ja2V0Q2FzZVNvdXJjZVBhdGggPQogICJkb2NzL2J1aWx0LXdpdGgtc2tpbGxzLzIwMjYtMDktMDItcm9ja2V0LWVkaXRvcmlhbC1lcnJvci1ib3VuZGFyeS5tZCI7Cg==
          CONST_INSERT_B64: Y29uc3Qgcm9ja2V0Q29kZWJhc2VDYXNlU291cmNlUGF0aCA9CiAgImRvY3MvYnVpbHQtd2l0aC1za2lsbHMvMjAyNi0wOS0wMi1yb2NrZXQtY29kZWJhc2UtaW50ZWxsaWdlbmNlLWNvc21pYy1zZGstcmVtb3ZhbC5tZCI7Cg==
          CASE_INSERT_B64: 
          SITE_OLD_B64: 
          SITE_NEW_B64: 
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const decode = (value) => Buffer.from(value, "base64").toString("utf8");
          const builtPath = "apps/web/src/lib/built-with-skills.ts";
          let built = await readFile(builtPath, "utf8");
          const constMarker = decode(process.env.CONST_MARKER_B64);
          const constInsert = decode(process.env.CONST_INSERT_B64);
          const caseInsert = decode(process.env.CASE_INSERT_B64);
          if (!built.includes("rocketCodebaseCaseSourcePath")) {
            if (!built.includes(constMarker)) throw new Error("rocket source-path marker not found");
            built = built.replace(constMarker, constInsert + constMarker);
          }
          if (!built.includes('slug: "rocket-codebase-intelligence-cosmic-sdk-removal"')) {
            const marker = "const cases = [\n";
            if (!built.includes(marker)) throw new Error("cases marker not found");
            built = built.replace(marker, marker + caseInsert);
          }
          await writeFile(builtPath, built, "utf8");
          const sitePath = "apps/web/src/components/site-shell.test.tsx";
          let site = await readFile(sitePath, "utf8");
          const siteOld = decode(process.env.SITE_OLD_B64);
          const siteNew = decode(process.env.SITE_NEW_B64);
          if (site.includes(siteOld)) site = site.replace(siteOld, siteNew);
          else if (!site.includes('async (locale, heading, codebase, rocket, ping, portfolio, catalog, packs)')) throw new Error("site-shell evidence block not found");
          await writeFile(sitePath, site, "utf8");
          NODE
      - name: Verify web evidence contracts
        run: |
          npm ci --prefix apps/web
          npm run web:test
      - name: Commit materialized case and synchronized archive test
        shell: bash
        run: |
          git add apps/web/src/lib/built-with-skills.ts apps/web/src/components/site-shell.test.tsx
          if git diff --cached --quiet; then
            echo "Case and test are already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "evidence(web): publish Rocket Codebase Intelligence case"
          git push origin HEAD:evidence/codebase-intelligence-real-use
