name: architecture-evidence-edit

on:
  push:
    branches: [feat/architecture-engineering-real-use]

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/architecture-engineering-real-use
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/insert-strata-evidence.mjs
      - name: Commit generated edit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/lib/built-with-skills.ts
          if git diff --cached --quiet; then
            echo "No edit required"
            exit 0
          fi
          git commit -m "feat: register STRATA architecture evidence"
          git push origin HEAD:feat/architecture-engineering-real-use
