name: Motion shell sync

on:
  push:
    branches:
      - feat/motion-real-use

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/motion-real-use
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchronize evidence shell assertion
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/web/src/components/site-shell.test.tsx';
          let source = fs.readFileSync(path, 'utf8');
          const replacements = [
            [
              '"Tightening Contracts boundaries without distributing the architecture", "Catalog experience", "Pack experience"',
              '"Tightening Contracts boundaries without distributing the architecture", "Hardening a cinematic WebGL experience for motion, accessibility, and reference fidelity", "Catalog experience", "Pack experience"',
            ],
            [
              '"Ajuste das fronteiras de Contracts sem distribuir a arquitetura", "Experiência do catálogo", "Experiência dos pacotes"',
              '"Ajuste das fronteiras de Contracts sem distribuir a arquitetura", "Hardening de uma experiência WebGL cinematográfica para motion, acessibilidade e fidelidade à referência", "Experiência do catálogo", "Experiência dos pacotes"',
            ],
            [
              'architectureEngineering, catalog, packs) => {',
              'architectureEngineering, motion, catalog, packs) => {',
            ],
          ];
          for (const [from, to] of replacements) {
            if (!source.includes(from)) throw new Error(`missing anchor: ${from}`);
            source = source.replace(from, to);
          }
          fs.writeFileSync(path, source);
          NODE
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/motion-shell-sync.yml
          git add apps/web/src/components/site-shell.test.tsx
          git commit -m "test: synchronize Motion evidence shell"
          git push origin HEAD:feat/motion-real-use
